<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Planner - Mock Exam Prep</title>
<style>


  :root{
    --bg:#0a0e14; --card:#131a24; --card2:#1a2330; --card3:#212c3b; --border:#2a3444;
    --text:#f0f4f9; --dim:#a9b4c4; --dim2:#79869a;
    --accent:#4ade80; --accent-dim:rgba(74,222,128,.14);
    --lit:#f472b6; --phy:#5eb0ff; --met:#fbbf24; --spe:#b794f6; --pe:#22d3ee; --mus:#fb923c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:32px 24px 60px;
  }
  .wrap{max-width:1180px; margin:0 auto;}
  .navbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; letter-spacing:-.01em;}
  .brand .sq{width:9px; height:9px; border-radius:3px; background:var(--accent); box-shadow:0 0 10px rgba(74,222,128,.6);}
  .navlinks{display:flex; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:11px; padding:4px;}
  .navlinks a{color:var(--dim); text-decoration:none; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px; transition:background .15s, color .15s;}
  .navlinks a:hover{color:var(--text); background:var(--card2);}
  .navlinks a.active{color:var(--bg); background:var(--accent);}
  .topbar{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; margin-bottom:24px;}
  .topbar h1{font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em;}
  .topbar .sub{color:var(--dim); font-size:13px;}
  .pill{
    background:var(--accent-dim); color:var(--accent); border:1px solid rgba(74,222,128,.35);
    padding:8px 16px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap;
    transition:transform .2s;
  }
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  .kpi{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; transition:border-color .2s, transform .2s;}
  .kpi:hover{border-color:var(--dim2); transform:translateY(-2px);}
  .kpi .lbl{color:var(--dim); font-size:12px; margin-bottom:8px; font-weight:500;}
  .kpi .val{font-size:27px; font-weight:800; letter-spacing:-.02em;}
  .kpi .val span{font-size:14px; color:var(--dim); font-weight:500;}
  .grid2{display:grid; grid-template-columns:1.4fr 1fr; gap:14px; margin-bottom:20px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; transition:box-shadow .3s, border-color .3s;}
  .card.complete{border-color:rgba(74,222,128,.5); box-shadow:0 0 0 1px rgba(74,222,128,.15), 0 0 28px rgba(74,222,128,.12);}
  .card h2{font-size:14px; font-weight:700; margin:0 0 14px; color:var(--text); display:flex; align-items:center; justify-content:space-between;}
  .card h2 .muted{color:var(--dim); font-weight:500; font-size:12px;}
  .celebrate{display:none; align-items:center; gap:8px; background:var(--accent-dim); color:var(--accent); border:1px solid rgba(74,222,128,.35); border-radius:10px; padding:9px 12px; font-size:12.5px; font-weight:600; margin-bottom:14px; animation:slideIn .35s ease;}
  .celebrate.show{display:flex;}
  @keyframes slideIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; margin:0 6px 12px 0;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .topic-text{color:var(--dim); font-size:13px; margin-bottom:16px; line-height:1.6;}
  .sess-head{display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--dim2); margin:16px 0 8px;}
  .sess-head:first-child{margin-top:0;}
  .sess-head .line{flex:1; height:1px; background:var(--border);}
  .sess-head.retrieval{color:var(--accent);}
  .sess-head.retrieval:before{content:"↻"; font-size:13px;}
  .checklist{display:flex; flex-direction:column; gap:8px;}
  .item{display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--card2); border-radius:10px; cursor:pointer; border:1px solid transparent; transition:border-color .15s, background .15s, transform .1s;}
  .item:hover{border-color:var(--dim2); background:var(--card3);}
  .item:active{transform:scale(.98);}
  .item.retrieval{background:rgba(74,222,128,.05); border-color:rgba(74,222,128,.15);}
  .item .box{width:19px; height:19px; border-radius:6px; border:2px solid var(--dim2); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:background .2s, border-color .2s;}
  .item.done .box{background:var(--accent); border-color:var(--accent);}
  .item.done .box:after{content:"✓"; font-size:12px; color:#08130d; font-weight:800;}
  .box.pop{animation:popCheck .32s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popCheck{0%{transform:scale(.55) rotate(-8deg);}55%{transform:scale(1.22) rotate(4deg);}100%{transform:scale(1) rotate(0);}}
  .item .lab{font-size:13.5px; line-height:1.4;}
  .item.done .lab{color:var(--dim); text-decoration:line-through;}
  .item .grp{font-size:10.5px; color:var(--dim); margin-left:auto; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; padding-left:10px;}
  .rings{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  .ring-item{display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0; transform:scale(.85); animation:ringIn .5s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes ringIn{to{opacity:1; transform:scale(1);}}
  .ring{width:66px; height:66px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative;}
  .ring .hole{width:48px; height:48px; border-radius:50%; background:var(--card); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;}
  .ring-name{font-size:11px; color:var(--dim); text-align:center; line-height:1.3;}
  .cal{margin-top:4px;}
  .cal-row{display:grid; grid-template-columns:44px repeat(7,1fr); gap:5px; align-items:center; margin-bottom:5px;}
  .cal-head{font-size:10.5px; color:var(--dim); text-align:center; font-weight:600;}
  .cal-wk-label{font-size:10.5px; color:var(--dim);}
  .cal-cell{
    aspect-ratio:1; border-radius:6px; background:var(--card2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--dim2); position:relative;
    transition:transform .15s;
  }
  .cal-cell:not(.faded):hover{transform:scale(1.12); z-index:2;}
  .cal-cell.faded{opacity:.3;}
  .subjects{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:20px;}
  .subj-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; border-left:3px solid var(--c); transition:transform .15s, border-color .15s;}
  .subj-card:hover{transform:translateY(-2px); border-color:var(--dim2);}
  .subj-card .name{font-size:12.5px; font-weight:700; margin-bottom:6px;}
  .subj-card .meta{font-size:11px; color:var(--dim); line-height:1.5;}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; font-size:11px; color:var(--dim);}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  footer{color:var(--dim2); font-size:12px; text-align:center; margin-top:28px; line-height:1.6;}

  /* Syllabus progress accordion */
  .syllabus{display:flex; flex-direction:column; gap:9px;}
  .subj-row{background:var(--card2); border:1px solid var(--border); border-radius:11px; overflow:hidden; transition:border-color .2s;}
  .subj-row:hover{border-color:var(--dim2);}
  .subj-row-head{display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer; user-select:none;}
  .subj-row .chev{transition:transform .25s; color:var(--dim); font-size:10px; flex-shrink:0;}
  .subj-row.open .chev{transform:rotate(90deg);}
  .subj-row-head .name2{font-weight:700; font-size:13px; flex:0 0 165px;}
  .bar-track{flex:1; height:9px; background:var(--border); border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; width:0; transition:width .8s cubic-bezier(.22,1,.36,1);}
  .subj-row-head .pct{font-size:12.5px; font-weight:800; width:42px; text-align:right; flex-shrink:0;}
  .subj-row-body{max-height:0; overflow:hidden; transition:max-height .35s ease;}
  .subj-row.open .subj-row-body{max-height:1200px;}
  .unit-block{padding:2px 14px 12px 40px;}
  .unit-head{font-size:11px; font-weight:700; color:var(--dim); margin:12px 0 7px; text-transform:uppercase; letter-spacing:.03em;}
  .unit-block .unit-block-bar{display:flex; align-items:center; gap:10px; margin-bottom:2px;}
  .unit-block .unit-block-bar .bar-track{height:7px;}
  .unit-block .unit-block-bar .pct{font-size:11px; color:var(--dim); width:34px; text-align:right;}
  .topic-row{display:flex; align-items:center; gap:10px; padding:6px 0 6px 14px; font-size:12.5px;}
  .topic-row .tname{flex:1; color:var(--text); line-height:1.4;}
  .topic-row .bar-track{height:6px; flex:0 0 90px;}
  .topic-row .pct{width:32px; font-size:11px; color:var(--dim); text-align:right;}
  footer{color:var(--dim2);}
  @media(max-width:820px){ .kpis{grid-template-columns:repeat(2,1fr);} .grid2{grid-template-columns:1fr;} .subjects{grid-template-columns:repeat(3,1fr);} .rings{grid-template-columns:repeat(3,1fr);}
    .subj-row-head .name2{flex-basis:110px; font-size:12px;} .topic-row .bar-track{flex-basis:60px;} }
  @media(max-width:520px){ .subjects{grid-template-columns:repeat(2,1fr);} .cal-row{grid-template-columns:30px repeat(7,1fr);} }

  /* Streak, milestones & toasts */
  .kpi-sub{font-size:10.5px; color:var(--dim2); margin-top:5px; font-weight:600; min-height:13px;}
  .kpi.streak-hot{border-color:rgba(251,146,60,.5); box-shadow:0 0 0 1px rgba(251,146,60,.15), 0 0 24px rgba(251,146,60,.14);}
  .kpi.streak-hot .val{color:#fb923c;}
  .streak-risk{display:none; align-items:center; gap:9px; background:rgba(251,146,60,.1); color:#fb923c; border:1px solid rgba(251,146,60,.35); border-radius:10px; padding:10px 14px; font-size:12.5px; font-weight:600; margin-bottom:16px; animation:slideIn .35s ease;}
  .streak-risk.show{display:flex;}
  .streak-risk .flame{font-size:15px; flex-shrink:0;}
  .toast-stack{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px; z-index:999; max-width:320px; pointer-events:none;}
  .toast{background:var(--card); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:12px; padding:13px 16px; box-shadow:0 10px 32px rgba(0,0,0,.4); animation:toastIn .4s cubic-bezier(.22,1,.36,1); pointer-events:auto;}
  .toast .t-title{font-weight:800; font-size:13px; margin-bottom:3px;}
  .toast .t-body{color:var(--dim); font-size:11.5px; line-height:1.4;}
  @keyframes toastIn{from{opacity:0; transform:translateX(30px) scale(.95);} to{opacity:1; transform:translateX(0) scale(1);}}
  .toast.out{animation:toastOut .3s ease forwards;}
  @keyframes toastOut{to{opacity:0; transform:translateX(30px) scale(.95);}}


  :root{
    --bg:#0a0e14; --card:#131a24; --card2:#1a2330; --card3:#212c3b; --border:#2a3444;
    --text:#f0f4f9; --dim:#a9b4c4; --dim2:#79869a;
    --accent:#4ade80; --accent-dim:rgba(74,222,128,.14);
    --amber:#fbbf24; --amber-dim:rgba(251,191,36,.14);
    --lit:#f472b6; --phy:#5eb0ff; --met:#fbbf24; --spe:#b794f6; --pe:#22d3ee; --mus:#fb923c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 24px 60px;
  }
  .wrap{max-width:1180px; margin:0 auto;}

  .navbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; letter-spacing:-.01em;}
  .brand .sq{width:9px; height:9px; border-radius:3px; background:var(--accent); box-shadow:0 0 10px rgba(74,222,128,.6);}
  .navlinks{display:flex; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:11px; padding:4px;}
  .navlinks a{color:var(--dim); text-decoration:none; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px; transition:background .15s, color .15s;}
  .navlinks a:hover{color:var(--text); background:var(--card2);}
  .navlinks a.active{color:var(--bg); background:var(--accent);}

  .pagehead{margin-bottom:20px;}
  .pagehead h1{font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em;}
  .pagehead .sub{color:var(--dim); font-size:13px;}

  .tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border); padding-bottom:0;}
  .tab-btn{background:none; border:none; color:var(--dim); font-size:13.5px; font-weight:600; padding:10px 4px; margin-right:22px; cursor:pointer; border-bottom:2px solid transparent; transition:color .15s, border-color .15s; font-family:inherit;}
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}
  .panel{display:none;}
  .panel.active{display:block; animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  .kpi{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; transition:transform .15s, border-color .15s;}
  .kpi:hover{transform:translateY(-2px); border-color:var(--dim2);}
  .kpi .lbl{color:var(--dim); font-size:12px; margin-bottom:8px; font-weight:500;}
  .kpi .val{font-size:26px; font-weight:800; letter-spacing:-.02em;}
  .kpi .val span{font-size:14px; color:var(--dim); font-weight:500;}
  .kpi.confident .val{color:var(--accent);}
  .kpi.reviewed .val{color:var(--amber);}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
  .search{flex:1; min-width:200px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 14px; color:var(--text); font-size:13.5px; font-family:inherit; outline:none; transition:border-color .15s;}
  .search:focus{border-color:var(--accent);}
  .search::placeholder{color:var(--dim2);}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{background:var(--card); border:1px solid var(--border); color:var(--dim); font-size:12px; font-weight:600; padding:8px 13px; border-radius:999px; cursor:pointer; transition:.15s; font-family:inherit;}
  .chip:hover{border-color:var(--dim2); color:var(--text);}
  .chip.active{background:var(--c,var(--accent)); border-color:var(--c,var(--accent)); color:#08130d;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px;}

  /* accordion (subject > unit > topic) */
  .subj-row{background:var(--card2); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:10px; transition:border-color .2s;}
  .subj-row:hover{border-color:var(--dim2);}
  .subj-row-head{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; user-select:none;}
  .subj-row .chev{transition:transform .25s; color:var(--dim); font-size:11px; flex-shrink:0;}
  .subj-row.open .chev{transform:rotate(90deg);}
  .subj-row-head .name2{font-weight:700; font-size:13.5px; flex:0 0 180px;}
  .bar-track{flex:1; height:9px; background:var(--border); border-radius:99px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; width:0; transition:width .7s cubic-bezier(.22,1,.36,1);}
  .subj-row-head .pct{font-size:12.5px; font-weight:800; width:70px; text-align:right; flex-shrink:0; color:var(--dim);}
  .subj-row-body{max-height:0; overflow:hidden; transition:max-height .35s ease;}
  .subj-row.open .subj-row-body{max-height:20000px;}

  .unit-block{padding:6px 16px 14px 42px;}
  .unit-head{font-size:11.5px; font-weight:700; color:var(--dim); margin:14px 0 8px; text-transform:uppercase; letter-spacing:.03em;}
  .topic-block{margin-bottom:10px;}
  .topic-head{display:flex; align-items:center; gap:10px; cursor:pointer; padding:6px 0; user-select:none;}
  .topic-head .chev2{font-size:9px; color:var(--dim2); transition:transform .2s;}
  .topic-block.open .chev2{transform:rotate(90deg);}
  .topic-head .tname{font-size:12.5px; font-weight:600; color:var(--text); flex:1;}
  .topic-head .bar-track{flex:0 0 90px; height:6px;}
  .topic-head .pct{font-size:11px; color:var(--dim); width:32px; text-align:right;}
  .topic-dots{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .topic-block.open .topic-dots{max-height:10000px;}

  .dot-row{display:flex; align-items:flex-start; gap:10px; padding:9px 10px 9px 22px; border-radius:9px; transition:background .15s;}
  .dot-row:hover{background:var(--card3);}
  .dot-row .dtext{flex:1; font-size:12.5px; line-height:1.55; color:var(--text); padding-top:2px;}
  .dot-row.conf-2 .dtext{color:var(--dim);}
  .exp-btn{flex-shrink:0; background:var(--bg); border:1px solid var(--border); color:var(--dim); font-size:11px; font-weight:700; border-radius:7px; width:34px; height:26px; cursor:pointer; transition:.15s; font-family:inherit;}
  .exp-btn:hover{border-color:var(--dim2);}
  .exp-btn.has{color:var(--text); border-color:var(--dim2);}
  .conf-btn{flex-shrink:0; border:none; font-size:10.5px; font-weight:700; border-radius:7px; padding:0 10px; height:26px; cursor:pointer; transition:.15s; font-family:inherit; text-transform:uppercase; letter-spacing:.03em; min-width:88px;}
  .conf-btn.c0{background:var(--card3); color:var(--dim);}
  .conf-btn.c1{background:var(--amber-dim); color:var(--amber);}
  .conf-btn.c2{background:var(--accent-dim); color:var(--accent);}
  .dot-row.hide{display:none;}
  .topic-block.hide, .unit-block.hide, .subj-row.hide{display:none;}

  /* exam conditions */
  .exam-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .exam-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; border-top:3px solid var(--c);}
  .exam-card h3{margin:0 0 4px; font-size:15px; font-weight:700;}
  .exam-card .metarow{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:12px; color:var(--dim); margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border);}
  .exam-card .metarow b{color:var(--text); font-weight:600;}
  .paper-row{background:var(--card2); border-radius:9px; padding:10px 12px; margin-bottom:8px; font-size:12px;}
  .paper-row .pname{font-weight:700; color:var(--text); margin-bottom:3px;}
  .paper-row .pcond{color:var(--c); font-weight:600; margin-bottom:3px;}
  .paper-row .pnote{color:var(--dim); line-height:1.5;}
  .field-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--dim); margin:14px 0 6px;}
  .field-label:first-of-type{margin-top:16px;}
  .practice-grid{display:grid; grid-template-columns:1fr 1.3fr 70px; gap:6px; margin-bottom:6px;}
  input.mini, textarea.mini{background:var(--card2); border:1px solid var(--border); border-radius:7px; padding:7px 9px; color:var(--text); font-size:12px; font-family:inherit; outline:none; transition:border-color .15s; width:100%;}
  input.mini:focus, textarea.mini:focus{border-color:var(--c, var(--accent));}
  textarea.mini{resize:vertical; min-height:50px; line-height:1.4;}
  input.mini::placeholder, textarea.mini::placeholder{color:var(--dim2);}

  /* weekly reflection */
  .week-row{background:var(--card2); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:10px;}
  .week-head{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; user-select:none;}
  .week-head .chev{transition:transform .25s; color:var(--dim); font-size:11px;}
  .week-row.open .chev{transform:rotate(90deg);}
  .week-head .wname{font-weight:700; font-size:13.5px; flex:1;}
  .week-head .wdone{font-size:11.5px; color:var(--dim);}
  .week-body{max-height:0; overflow:hidden; transition:max-height .4s ease;}
  .week-row.open .week-body{max-height:6000px;}
  .week-inner{padding:4px 16px 18px;}
  .refl-table{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .refl-item{background:var(--card3); border-radius:10px; padding:12px 14px; border-left:3px solid var(--c);}
  .refl-item .rs{font-weight:700; font-size:12.5px; margin-bottom:8px; color:var(--c);}
  .refl-fields{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .refl-fields textarea{min-height:44px;}
  .wk-checklist{display:flex; flex-direction:column; gap:7px;}
  .wk-check{display:flex; align-items:center; gap:10px; padding:9px 11px; background:var(--card3); border-radius:9px; cursor:pointer; font-size:12.5px; transition:background .15s;}
  .wk-check:hover{background:var(--border);}
  .wk-check .box{width:17px; height:17px; border-radius:5px; border:2px solid var(--dim2); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .wk-check.done .box{background:var(--accent); border-color:var(--accent);}
  .wk-check.done .box:after{content:"\2713"; font-size:11px; color:#08130d; font-weight:800;}
  .wk-check.done .lab{color:var(--dim); text-decoration:line-through;}

  .savehint{color:var(--dim2); font-size:11.5px; text-align:center; margin-top:6px;}
  footer{color:var(--dim2); font-size:12px; text-align:center; margin-top:28px; line-height:1.6;}

  @media(max-width:820px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .exam-grid{grid-template-columns:1fr;}
    .refl-fields{grid-template-columns:1fr;}
    .subj-row-head .name2{flex-basis:110px; font-size:12px;}
    .practice-grid{grid-template-columns:1fr;}
  }

  /* Goal-gradient remaining count + milestone toasts */
  .subj-row-head .pct{width:84px; line-height:1.3;}
  .subj-row-head .pct .left{display:block; font-size:9.5px; font-weight:600; color:var(--dim2); text-transform:none; letter-spacing:0;}
  .toast-stack{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:10px; z-index:999; max-width:320px; pointer-events:none;}
  .toast{background:var(--card); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:12px; padding:13px 16px; box-shadow:0 10px 32px rgba(0,0,0,.4); animation:toastIn .4s cubic-bezier(.22,1,.36,1); pointer-events:auto;}
  .toast .t-title{font-weight:800; font-size:13px; margin-bottom:3px;}
  .toast .t-body{color:var(--dim); font-size:11.5px; line-height:1.4;}
  @keyframes toastIn{from{opacity:0; transform:translateX(30px) scale(.95);} to{opacity:1; transform:translateX(0) scale(1);}}
  .toast.out{animation:toastOut .3s ease forwards;}
  @keyframes toastOut{to{opacity:0; transform:translateX(30px) scale(.95);}}

.page-nav{display:flex; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:11px; padding:4px; width:fit-content; margin-bottom:20px;}
.page-tab-btn{background:none; border:none; color:var(--dim); font-size:12.5px; font-weight:600; padding:8px 16px; border-radius:8px; cursor:pointer; font-family:inherit; transition:background .15s, color .15s;}
.page-tab-btn:hover{color:var(--text);}
.page-tab-btn.active{color:var(--bg); background:var(--accent);}
.page-panel{display:none;}
.page-panel.active{display:block;}



.pagehead{margin-bottom:20px;}
.pagehead h1{font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em;}
.pagehead .sub{color:var(--dim); font-size:13px;}
.backlink{display:inline-flex; align-items:center; gap:6px; color:var(--dim); text-decoration:none; font-size:13px; font-weight:600; margin-bottom:16px; cursor:pointer;}
.backlink:hover{color:var(--text);}

</style>
</head>
<body>
<div class="wrap">
  <div class="navbar">
    <div class="brand"><span class="sq"></span>Mock exam prep</div>
    <div class="navlinks">
      <a href="https://mock-exam-dashboard.vercel.app/">Dashboard</a>
      <a href="https://mock-exam-tracker-raidentame1-3207s-projects.vercel.app/">Tracker</a>
      <a href="#" class="active">Planner</a>
    </div>
  </div>
  <div class="pagehead">
    <h1>Exam planner</h1>
    <div class="sub">Exam conditions &middot; weekly reflection &mdash; all six Unit 3&ndash;4 subjects</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="exam">Exam Conditions</button>
    <button class="tab-btn" data-tab="weekly">Weekly Reflection</button>
  </div>
  <div class="panel active" id="panel-exam">
    <div class="exam-grid" id="examGrid"></div>
  </div>
  <div class="panel" id="panel-weekly">
    <div class="card">
      <div id="weeklyGrid"></div>
    </div>
  </div>

</div>
<script>

function load(key){ try{ return JSON.parse(localStorage.getItem(key)||"{}"); }catch(e){ return {}; } }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

const SUBJECT_COLORS = {"Literature": "#f472b6", "Physics": "#5eb0ff", "Mathematical Methods": "#fbbf24", "Specialist Mathematics": "#b794f6", "Physical Education": "#22d3ee", "Music": "#fb923c"};
const SUBJECT_ORDER = ["Literature", "Physics", "Mathematical Methods", "Specialist Mathematics", "Physical Education", "Music"];
const EXAM_INFO = {"Literature": {"mock": "Monday 7 September 2026, 8:45&ndash;11:15am (2hrs 15min)", "weight": "25% (single external exam)", "content": "Unit 4 only &mdash; unseen question on your studied text (The Picture of Dorian Gray).", "papers": [{"name": "Paper 1 (only paper)", "cond": "Planning: 15 min / Working: 120 min", "note": "Written analytical essay responding to an unseen question. No text/notes allowed in the exam."}]}, "Physics": {"mock": "Thursday 10 September 2026, 12:00&ndash;2:50pm (2hrs 5min &mdash; one combined paper for the mock, unlike the real exam's separate Paper 1 &amp; 2)", "weight": "50% total (Paper 1: 25% + Paper 2: 25%)", "content": "Units 3 & 4.", "papers": [{"name": "Paper 1", "cond": "Perusal: 5 min / Working: 90 min", "note": "MC, short & extended response. QCAA-approved calculator + QCAA Physics formula/data book provided."}, {"name": "Paper 2", "cond": "Perusal: 5 min / Working: 90 min", "note": "MC, short & extended response. QCAA-approved calculator + QCAA Physics formula/data book provided."}]}, "Mathematical Methods": {"mock": "Tuesday 8 September 2026, 8:45&ndash;11:15am (2hrs 20min &mdash; two 1hr papers with a 10min break between, in one session)", "weight": "50% total (Paper 1: 25% + Paper 2: 25%)", "content": "Units 3 & 4 (assumes knowledge from Units 1 & 2).", "papers": [{"name": "Paper 1", "cond": "Perusal: 5 min / Working: 90 min", "note": "Technology-free. Short response & multiple choice. No calculator, no notes."}, {"name": "Paper 2", "cond": "Perusal: 5 min / Working: 90 min", "note": "Technology-active. Short response & multiple choice. QCAA-approved calculator (no CAS) allowed."}]}, "Specialist Mathematics": {"mock": "Monday 14 September 2026, 8:45&ndash;11:15am (2hrs 20min &mdash; two 1hr papers with a 10min break between, in one session)", "weight": "50% total (Paper 1: 25% + Paper 2: 25%)", "content": "Units 3 & 4 (assumes knowledge from Units 1, 2 & Mathematical Methods).", "papers": [{"name": "Paper 1", "cond": "Perusal: 5 min / Working: 90 min", "note": "Technology-free. Short response & multiple choice. No calculator, no notes."}, {"name": "Paper 2", "cond": "Perusal: 5 min / Working: 90 min", "note": "Technology-active. Short response & multiple choice. QCAA-approved calculator (no CAS) allowed."}]}, "Physical Education": {"mock": "Friday 11 September 2026, 12:00&ndash;2:50pm (2hrs 5min)", "weight": "25% (single external exam)", "content": "Unit 4 only.", "papers": [{"name": "Paper 1 (only paper)", "cond": "Perusal: 5 min / Working: 120 min", "note": "Combination response: multiple choice, short response and extended response."}]}, "Music": {"mock": "Wednesday 9 September 2026, 8:45&ndash;11:15am (2hrs 20min)", "weight": "25% (single external exam)", "content": "Unit 4 only &mdash; analysis/aural (no performance or composition).", "papers": [{"name": "Paper 1 (only paper)", "cond": "Planning: 20 min / Working: 120 min", "note": "Unseen stimulus, analytical essay expressing a viewpoint &mdash; analyse, evaluate and communicate."}]}};
const REAL_EXAM = "Oct/Nov 2026 (QCAA common assessment window &mdash; confirm exact date on the QCAA website closer to the time)";
const WEEK_LABELS = ["Week 1 (5&ndash;9 Aug)", "Week 2 (10&ndash;16 Aug)", "Week 3 (17&ndash;23 Aug)", "Week 4 (24&ndash;30 Aug)", "Week 5 (31 Aug&ndash;6 Sep)"];
const WEEKLY_CHECKLIST = ["Classwork/homework for the week is up to date", "Dot-Point Tracker updated (confidence + exposure) for everything covered this week", "This week's rings/progress checked &mdash; lowest % subject identified for weekend focus", "Any clarifying questions for teachers written down", "Next week's Daily Schedule sessions reviewed/adjusted if needed"];

const examStore = load('examplanner_v1');
function renderExamGrid(){
  const wrap = document.getElementById('examGrid');
  wrap.innerHTML = "";
  SUBJECT_ORDER.forEach(s=>{
    const color = SUBJECT_COLORS[s];
    const info = EXAM_INFO[s];
    const rec = examStore[s] || {};
    const card = document.createElement('div');
    card.className = "exam-card";
    card.style.setProperty('--c', color);
    const papersHtml = info.papers.map(p=>`<div class="paper-row"><div class="pname">${p.name}</div><div class="pcond">${p.cond}</div><div class="pnote">${p.note}</div></div>`).join('');
    const practiceRows = [1,2,3,4].map(n=>{
      const pr = rec['p'+n] || {};
      return `<div class="practice-grid"><input class="mini" data-subject="${s}" data-field="p${n}_date" type="text" placeholder="Date" value="${pr.date||''}"><input class="mini" data-subject="${s}" data-field="p${n}_source" type="text" placeholder="Source / paper" value="${pr.source||''}"><input class="mini" data-subject="${s}" data-field="p${n}_score" type="text" placeholder="Score" value="${pr.score||''}"></div>`;
    }).join('');
    card.innerHTML = `<h3 style="color:${color};">${s}</h3><div class="metarow"><span><b>Mock:</b> ${info.mock}</span><span><b>Real exam:</b> ${REAL_EXAM}</span><span><b>Weight:</b> ${info.weight}</span><span><b>Content:</b> ${info.content}</span></div>${papersHtml}<div class="field-label">Practice exam log</div>${practiceRows}<div class="field-label">Reflection &amp; review</div><div class="practice-grid" style="grid-template-columns:1fr 1fr;"><input class="mini" data-subject="${s}" data-field="formative" type="text" placeholder="Formative (mock) mark" value="${rec.formative||''}"><input class="mini" data-subject="${s}" data-field="expected" type="text" placeholder="Expected final mark" value="${rec.expected||''}"></div><textarea class="mini" data-subject="${s}" data-field="strengths" placeholder="Strengths">${rec.strengths||''}</textarea><div style="height:6px;"></div><textarea class="mini" data-subject="${s}" data-field="weaknesses" placeholder="Weaknesses">${rec.weaknesses||''}</textarea><div style="height:6px;"></div><textarea class="mini" data-subject="${s}" data-field="actions" placeholder="Actions before the real exam">${rec.actions||''}</textarea><div style="height:6px;"></div><input class="mini" data-subject="${s}" data-field="actual" type="text" placeholder="Actual mark (fill in after the real exam)" value="${rec.actual||''}">`;
    wrap.appendChild(card);
  });
  wrap.querySelectorAll('input.mini, textarea.mini').forEach(el=>{
    el.addEventListener('change', ()=>{
      const s = el.dataset.subject, f = el.dataset.field;
      if(!examStore[s]) examStore[s] = {};
      if(f.startsWith('p') && f.includes('_')){ const [pkey, sub] = f.split('_'); if(!examStore[s][pkey]) examStore[s][pkey] = {}; examStore[s][pkey][sub] = el.value; } else { examStore[s][f] = el.value; }
      save('examplanner_v1', examStore);
    });
  });
}

const weeklyStore = load('weeklyreview_v1');
function renderWeeklyGrid(){
  const wrap = document.getElementById('weeklyGrid');
  wrap.innerHTML = "";
  WEEK_LABELS.forEach((label, wi)=>{
    const wrec = weeklyStore[wi] || {subjTexts:{}, checklist:[]};
    const doneCount = (wrec.checklist||[]).filter(Boolean).length;
    const row = document.createElement('div');
    row.className = "week-row";
    const head = document.createElement('div');
    head.className = "week-head";
    head.innerHTML = `<span class="chev">&#9656;</span><span class="wname">${label}</span><span class="wdone">${doneCount}/5 checklist</span>`;
    head.addEventListener('click', ()=> row.classList.toggle('open'));
    row.appendChild(head);
    const body = document.createElement('div');
    body.className = "week-body";
    const inner = document.createElement('div');
    inner.className = "week-inner";
    const table = document.createElement('div');
    table.className = "refl-table";
    SUBJECT_ORDER.forEach(s=>{
      const srec = (wrec.subjTexts && wrec.subjTexts[s]) || {};
      const item = document.createElement('div');
      item.className = "refl-item";
      item.style.setProperty('--c', SUBJECT_COLORS[s]);
      item.innerHTML = `<div class="rs">${s}</div><div class="refl-fields"><textarea class="mini" data-week="${wi}" data-subject="${s}" data-field="learned" placeholder="What I learned">${srec.learned||''}</textarea><textarea class="mini" data-week="${wi}" data-subject="${s}" data-field="focus" placeholder="Focus areas (weak/new)">${srec.focus||''}</textarea><textarea class="mini" data-week="${wi}" data-subject="${s}" data-field="reflect" placeholder="Reflection on study">${srec.reflect||''}</textarea></div>`;
      table.appendChild(item);
    });
    inner.appendChild(table);
    const clWrap = document.createElement('div');
    clWrap.className = "wk-checklist";
    WEEKLY_CHECKLIST.forEach((label2, ci)=>{
      const done = !!(wrec.checklist && wrec.checklist[ci]);
      const c = document.createElement('div');
      c.className = "wk-check" + (done?" done":"");
      c.innerHTML = `<span class="box"></span><span class="lab">${label2}</span>`;
      c.addEventListener('click', ()=>{
        if(!weeklyStore[wi]) weeklyStore[wi] = {subjTexts:{}, checklist:[]};
        if(!weeklyStore[wi].checklist) weeklyStore[wi].checklist = [];
        weeklyStore[wi].checklist[ci] = !weeklyStore[wi].checklist[ci];
        save('weeklyreview_v1', weeklyStore);
        renderWeeklyGrid();
      });
      clWrap.appendChild(c);
    });
    inner.appendChild(clWrap);
    body.appendChild(inner);
    row.appendChild(body);
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('textarea.mini').forEach(el=>{
    el.addEventListener('change', ()=>{
      const wi = el.dataset.week, s = el.dataset.subject, f = el.dataset.field;
      if(!weeklyStore[wi]) weeklyStore[wi] = {subjTexts:{}, checklist:[]};
      if(!weeklyStore[wi].subjTexts) weeklyStore[wi].subjTexts = {};
      if(!weeklyStore[wi].subjTexts[s]) weeklyStore[wi].subjTexts[s] = {};
      weeklyStore[wi].subjTexts[s][f] = el.value;
      save('weeklyreview_v1', weeklyStore);
    });
  });
}

renderExamGrid();
renderWeeklyGrid();

</script>
</body>
</html>
